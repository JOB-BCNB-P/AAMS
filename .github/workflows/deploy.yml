# ================================================================
# นำเว็บขึ้น GitHub Pages อัตโนมัติทุกครั้งที่ push ขึ้น branch main
#
# ตั้งค่าครั้งเดียวที่ GitHub:
#   Settings → Pages → Build and deployment → Source = "GitHub Actions"
# ================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: เช็คเอาต์โค้ด
        uses: actions/checkout@v4

      - name: ตรวจว่าไม่มีคีย์ลับหลุดเข้ามาใน repo
        run: |
          # ตรวจเฉพาะ "รูปแบบของคีย์จริง" ไม่ใช่คำที่พูดถึงคีย์ในคอมเมนต์
          #   sb_secret_...                      = secret key รูปแบบใหม่
          #   SUPABASE_SERVICE_ROLE_KEY = ...    = การกำหนดค่าคีย์ลับลงตัวแปร
          #   "role":"service_role"              = payload ของ JWT ที่ถอดรหัสแล้ว
          if grep -rIn --include='*.js' --include='*.html' --include='*.css' --include='*.json' \
               --exclude-dir=.git --exclude-dir=.github \
               -E 'sb_secret_[A-Za-z0-9_-]{10,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*.[A-Za-z0-9]|"role"[[:space:]]*:[[:space:]]*"service_role"' . ; then
            echo "::error::พบคีย์ลับระดับเซิร์ฟเวอร์ในไฟล์ที่จะเผยแพร่ — กรุณาลบออกก่อน deploy"
            exit 1
          fi
          echo "ผ่าน: ไม่พบคีย์ลับในไฟล์ที่จะเผยแพร่"

      - name: ตรวจไวยากรณ์ JavaScript
        run: |
          for f in config.js supabase-db.js auth.js app-patch.js app.js grad-images.js; do
            node --check "$f" && echo "OK  $f"
          done

      - name: เตรียมไฟล์สำหรับเผยแพร่
        run: |
          mkdir -p _site
          rsync -av --exclude '.git' --exclude '.github' --exclude '_site' \
                    --exclude 'supabase' --exclude 'node_modules' \
                    ./ _site/
          touch _site/.nojekyll

      - name: อัปโหลด artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: เผยแพร่ขึ้น GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
